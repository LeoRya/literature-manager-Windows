name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        shell: pwsh
        run: .\build_windows.ps1 -SkipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: LiteratureManager-Windows-x64
          path: dist/LiteratureManager-Windows-x64.zip
          if-no-files-found: error
